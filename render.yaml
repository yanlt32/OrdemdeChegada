# Configuração da Render (Blueprint). Em https://dashboard.render.com: New > Blueprint > escolha este repositório.
# O banco SQLite fica no Persistent Disk (/var/data), que não é apagado nos deploys.
# Disco só existe em plano pago (Starter).
services:
  - type: web
    name: fila-barbearia-wagner
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/saude
    disk:
      name: dados
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: America/Sao_Paulo
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_SENHA # senha do painel do Wagner (a Render pede na criação)
        sync: false
